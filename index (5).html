<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Tabuada Interativo</title>
</head>
<body>

  <h1>Gerador de Tabuada Interativo</h1>
  
  <label for="numero">Insira um número (1 a 10):</label>
  <input type="number" id="numero" min="1" max="10" step="1">
  <button onclick="gerarTabuada()">Gerar Tabuada</button>

  <div id="resultado"></div>

  <script>
    function gerarTabuada() {
      const input = document.getElementById("numero");
      const valor = Number(input.value); // Number() é mais seguro que parseInt
      const resultado = document.getElementById("resultado");

      // Validação (checa se é nulo, se não é número, se não é inteiro, ou se está fora do limite)
      if (input.value === "" || isNaN(valor) || !Number.isInteger(valor) || valor < 1 || valor > 10) {
        resultado.innerHTML = "<p style='color: red;'>Por favor, insira um número inteiro entre 1 e 10.</p>";
        return;
      }

      // Monta o resultado em uma variável (melhor performance)
      let html = "<h3>Tabuada do " + valor + ":</h3>";

      // Estrutura de repetição 'for' 
      for (let i = 1; i <= 10; i++) {
        html += "<p>" + valor + " x " + i + " = " + (valor * i) + "</p>";
      }

      // Atualiza a tela apenas uma vez com todo o conteúdo pronto
      resultado.innerHTML = html;
    }
  </script>

</body>
</html>
