<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Tabuada Interativo</title>
</head>
<body>

  <h1>Gerador de Tabuada Interativo</h1>
  
  <label for="numero">Insira um número (1 a 10):</label>
  <input type="number" id="numero" min="1" max="10">
  <button onclick="gerarTabuada()">Gerar Tabuada</button>

  <div id="resultado"></div>

  <script>
    function gerarTabuada() {
      const input = document.getElementById("numero");
      const valor = parseInt(input.value);
      const resultado = document.getElementById("resultado");

      // Validação 
      if (isNaN(valor) || valor < 1 || valor > 10) {
        resultado.innerHTML = "<p style='color: red;'>Por favor, insira um número entre 1 e 10.</p>";
        return;
      }

      // Limpar o resultado anterior
      resultado.innerHTML = "<h3>Tabuada do " + valor + ":</h3>";

      // Estrutura de repetição 'for' 
      for (let i = 1; i <= 10; i++) {
        resultado.innerHTML += "<p>" + valor + " x " + i + " = " + (valor * i) + "</p>";
      }
    }
  </script>

</body>
</html>
